  <rect width="64" height="64" rx="12" fill="#0d1117"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle" letter-spacing="0">
    <text x="32" y="28" fill="#f6f8fa" font-size="16" font-weight="760">wavey</text>
    <text x="32" y="46" fill="#c9d1d9" font-size="18" font-weight="300">gist</text>
  </g>
