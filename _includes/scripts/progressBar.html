{% if site.enable_progressbar %}

<!-- Scrolling Progress Bar -->
<script type="text/javascript">
  (() => {
    const progressBar = document.getElementById("progress");
    if (!progressBar) return;

    const getScrollTop = () => window.scrollY || document.documentElement.scrollTop || 0;
    const getDistanceToScroll = () => {
      const scrollHeight = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight
      );
      return Math.max(scrollHeight - window.innerHeight, 0);
    };

    const updatePosition = () => {
      const navbar = document.getElementById("navbar");
      if (navbar) {
        progressBar.style.top = `${navbar.offsetHeight}px`;
      }
    };

    const updateProgress = () => {
      const distance = getDistanceToScroll();
      if ("max" in document.createElement("progress")) {
        progressBar.max = distance;
        progressBar.value = getScrollTop();
      } else {
        progressBar.style.width = distance ? `${(getScrollTop() / distance) * 100}%` : "0";
      }
    };

    const refresh = () => {
      updatePosition();
      updateProgress();
    };

    window.addEventListener("load", () => setTimeout(refresh, 50));
    window.addEventListener("resize", refresh);
    document.addEventListener("scroll", updateProgress, { passive: true });
  })();
</script>

{%- endif %}
